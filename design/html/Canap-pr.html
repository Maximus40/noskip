<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>NoSkip — Le Canap', mascotte animée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400;100,600;100,800;125,700;125,800&amp;display=swap">
<style>
body{margin:0}
a{color:#F4F4EF}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
@keyframes canap-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.035)}}
@keyframes canap-laugh{0%,100%{transform:translateY(0) rotate(0deg)}15%{transform:translateY(-10px) rotate(-3deg)}30%{transform:translateY(0) rotate(2deg)}45%{transform:translateY(-7px) rotate(-2deg)}60%{transform:translateY(0) rotate(1deg)}75%{transform:translateY(-3px) rotate(0deg)}}
@keyframes canap-sulk{0%,100%{transform:scaleY(1) translateX(0)}50%{transform:scaleY(0.95) translateX(-3px)}}
@keyframes canap-crush{0%{transform:scaleY(1) scaleX(1)}25%{transform:scaleY(0.45) scaleX(1.25)}45%{transform:scaleY(0.68) scaleX(1.08)}65%{transform:scaleY(0.56) scaleX(1.17)}100%{transform:scaleY(0.6) scaleX(1.14)}}
@keyframes canap-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(0.08)}}
@keyframes canap-crumb{0%{transform:translateY(0);opacity:1}100%{transform:translateY(40px);opacity:0}}
@keyframes canap-chalk{0%{transform:translateY(0) scale(0.6);opacity:0}30%{opacity:1}100%{transform:translateY(-60px) scale(1.3);opacity:0}}
.canap-mood{transform-origin:50% 92%;transform-box:view-box}
.canap-idle{animation:canap-breathe 3.2s ease-in-out infinite}
.canap-smug{animation:canap-laugh 1.1s ease-in-out infinite}
.canap-sad{animation:canap-sulk 2.6s ease-in-out infinite}
.canap-crushed{animation:canap-crush 0.9s cubic-bezier(.3,1.5,.5,1) forwards}
.canap-eye{transform-box:fill-box;transform-origin:center;animation:canap-blink 4.2s infinite}
.canap-crumbs circle{animation:canap-crumb 1.1s ease-in infinite}
.canap-crumbs circle:nth-child(2){animation-delay:.35s}
.canap-crumbs circle:nth-child(3){animation-delay:.7s}
.canap-dust circle{animation:canap-chalk 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.canap-dust circle:nth-child(2){animation-delay:.3s}
.canap-dust circle:nth-child(3){animation-delay:.6s}
.canap-dust circle:nth-child(4){animation-delay:.9s}
@media (prefers-reduced-motion: reduce){.canap-idle,.canap-smug,.canap-sad,.canap-crushed,.canap-eye,.canap-crumbs circle,.canap-dust circle{animation:none}}
</style>
</head>
<body>
<div style="width: 720px; height: 720px; box-sizing: border-box; background: #111214; color: #F5F5F0; font-family: Archivo, system-ui, sans-serif; padding: 40px; display: flex; flex-direction: column; gap: 20px">

  <div style="display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; color: #A3A4A9">MASCOTTE · 4 HUMEURS ANIMÉES</div>
      <h1 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 125%; font-weight: 800; font-size: 52px; line-height: 1">LE CANAP'</h1>
    </div>
    <div style="font-size: 13px; color: #C9CDD2; text-align: right; line-height: 1.4">Clique une humeur<br>pour la jouer</div>
  </div>

  <div style="flex: 1; background: #ECECE8; color: #0E0F11; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; position: relative; overflow: hidden">

    

    

    

    
      <svg viewBox="0 0 240 200" width="400" height="333" role="img" aria-label="Le Canap' écrasé par la barre de la team après un PR">
        <ellipse cx="120" cy="186" rx="110" ry="9" fill="#000000" opacity="0.2"></ellipse>
        <g class="canap-dust"><circle cx="40" cy="150" r="6" fill="#9A9A94" opacity="0.7"></circle><circle cx="200" cy="148" r="7" fill="#9A9A94" opacity="0.6"></circle><circle cx="80" cy="160" r="5" fill="#9A9A94" opacity="0.6"></circle><circle cx="165" cy="162" r="5" fill="#9A9A94" opacity="0.7"></circle></g>
        <g class="canap-mood canap-crushed">
          <rect x="44" y="160" width="14" height="22" rx="3" fill="#111111"></rect>
          <rect x="182" y="160" width="14" height="22" rx="3" fill="#111111"></rect>
          <rect x="40" y="28" width="160" height="104" rx="36" fill="#2B2B2B"></rect>
          <rect x="30" y="112" width="180" height="52" rx="20" fill="#1F1F1F"></rect>
          <rect x="12" y="88" width="42" height="80" rx="20" fill="#3A3A3A"></rect>
          <rect x="186" y="88" width="42" height="80" rx="20" fill="#3A3A3A"></rect>
          <path d="M88 70 L108 88 M108 70 L88 88" stroke="#F4F4EF" stroke-width="5" stroke-linecap="round"></path>
          <path d="M132 70 L152 88 M152 70 L132 88" stroke="#F4F4EF" stroke-width="5" stroke-linecap="round"></path>
          <path d="M104 106 Q120 100 136 106" stroke="#F5F5F0" stroke-width="3.5" fill="none" stroke-linecap="round"></path>
          <path d="M122 106 Q126 120 132 107" fill="#E57373"></path>
          <rect x="-10" y="14" width="260" height="10" rx="5" fill="#8A9099"></rect>
          <rect x="6" y="-12" width="14" height="62" rx="4" fill="#F5F5F0"></rect>
          <rect x="22" y="-12" width="14" height="62" rx="4" fill="#FF6A3D"></rect>
          <rect x="204" y="-12" width="14" height="62" rx="4" fill="#FF6A3D"></rect>
          <rect x="220" y="-12" width="14" height="62" rx="4" fill="#F5F5F0"></rect>
        </g>
      </svg>
      <div style="font-family: Archivo, sans-serif; font-stretch: 125%; font-weight: 800; font-size: 24px; color: #FF6A3D">PR DE LA TEAM</div>
      <div style="font-size: 14px; color: #3A3B40">La barre de la team l'écrase, nuage de craie. Joue au bilan quand la team bat son record.</div>
    
  </div>

  <div role="group" aria-label="Choisir l'humeur du Canap'" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
    <button type="button" style="min-height: 48px; border-radius: 14px; border: 1px solid #3A3E45; background: #1A1C20; color: #F4F4EF; font-weight: 700; font-size: 14px">Repos</button>
    <button type="button" style="min-height: 48px; border-radius: 14px; border: 1px solid #3A3E45; background: #1A1C20; color: #F4F4EF; font-weight: 700; font-size: 14px">Skip</button>
    <button type="button" style="min-height: 48px; border-radius: 14px; border: 1px solid #3A3E45; background: #1A1C20; color: #F4F4EF; font-weight: 700; font-size: 14px">Disque chargé</button>
    <button type="button" style="min-height: 48px; border-radius: 14px; border: 1px solid #3A3E45; background: rgba(255,106,61,0.28); color: #F4F4EF; font-weight: 700; font-size: 14px">PR team</button>
  </div>
</div>
</body>
</html>
