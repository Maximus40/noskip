<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>NoSkip V3 — Disque chargé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400;100,500;100,600;100,800;100,900;125,500;125,700;125,800&amp;display=swap">
<style>
body{margin:0}
a{color:#F5F5F0}a:hover{color:#FFFFFF}
button{font-family:inherit;cursor:pointer}
@keyframes ns-drop{0%{transform:translateX(-40px);opacity:0}70%{transform:translateX(3px);opacity:1}100%{transform:translateX(0)}}
.ns-new{animation:ns-drop .7s cubic-bezier(.2,1.4,.4,1) .3s both}
@media (prefers-reduced-motion: reduce){.ns-new{animation:none}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111214; color: #F5F5F0; font-family: Archivo, system-ui, sans-serif; display: flex; flex-direction: column; padding: 54px 16px 30px 16px">

  <div style="display: flex; justify-content: flex-end">
    <a href="V3-Team.dc.html" aria-label="Fermer" style="width: 48px; height: 48px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; color: #FF6A3D">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>

    <a href="V3-Team.dc.html" style="margin-top: 8px; min-height: 58px; border-radius: 14px; background: #FF6A3D; color: #0E0F11; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 16px; letter-spacing: 0.06em">
      VOIR LA BARRE
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"></path></svg>
    </a>
  </div>

  <div style="margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 0 4px">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-stretch: 125%; font-weight: 700; font-size: 24px">52:10</span><span style="font-size: 13px; color: #A3A4A9">Sur place</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-stretch: 125%; font-weight: 700; font-size: 24px">87,5</span><span style="font-size: 13px; color: #A3A4A9">Kg sur ta barre</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px; align-items: flex-end"><span style="font-stretch: 125%; font-weight: 700; font-size: 24px">5 sem.</span><span style="font-size: 13px; color: #A3A4A9">Série duo</span></div>
  </div>

  <div style="margin-top: 20px; border-radius: 22px; background: #1A1B1F; border: 1px solid rgba(255,255,255,0.08); padding: 16px 14px; display: flex; flex-direction: column; gap: 6px">
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #A3A4A9"><span>Barre de la team</span><span style="color: #F5F5F0; font-stretch: 125%; font-weight: 700">160 kg</span></div>
    <svg viewBox="0 0 350 110" width="330" height="104" role="img" aria-label="Barre de la team : ton nouveau disque vient d'être chargé">
      <rect x="0" y="52" width="350" height="6" rx="3" fill="#8E9096"></rect>
      <rect x="148" y="50" width="54" height="10" rx="3" fill="#5E6066"></rect>

      <rect x="208" y="42" width="6" height="26" rx="2" fill="#C4C6CB"></rect>

      <rect x="8" y="8" width="13" height="94" rx="3" fill="#B9BBC0"></rect>
      <rect x="217" y="8" width="13" height="94" rx="3" fill="#F5F5F0"></rect>
      <rect x="233" y="8" width="13" height="94" rx="3" fill="#F5F5F0"></rect>
      <rect x="249" y="8" width="13" height="94" rx="3" fill="#F5F5F0"></rect>
      <rect x="265" y="8" width="13" height="94" rx="3" fill="#FF6A3D"></rect>
      <rect x="281" y="8" width="13" height="94" rx="3" fill="#FF6A3D"></rect>
      <rect class="ns-new" x="297" y="8" width="13" height="94" rx="3" fill="#FF6A3D"></rect>
      <rect x="313" y="8" width="13" height="94" rx="3" fill="#7C7E84"></rect>
      <rect x="329" y="8" width="13" height="94" rx="3" fill="#B9BBC0"></rect>
    </svg>
  </div>

  <div style="flex: 1"></div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 0 4px">
    <svg viewBox="0 0 120 90" width="72" height="54" aria-hidden="true">
      <rect x="14" y="10" width="92" height="46" rx="16" fill="#3A3B41" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"></rect>
      <rect x="8" y="44" width="104" height="28" rx="12" fill="#2C2D32" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"></rect>
      <rect x="2" y="34" width="22" height="40" rx="10" fill="#45464C" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"></rect>
      <rect x="96" y="34" width="22" height="40" rx="10" fill="#45464C" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"></rect>
      <ellipse cx="46" cy="30" rx="9" ry="7" fill="#F5F5F0"></ellipse>
      <ellipse cx="74" cy="30" rx="9" ry="7" fill="#F5F5F0"></ellipse>

      <circle cx="74" cy="34" r="3" fill="#0E0F11"></circle>
      <rect x="36" y="22" width="20" height="9" fill="#3A3B41"></rect>
      <rect x="64" y="22" width="20" height="9" fill="#3A3B41"></rect>
      <path d="M50 44 Q60 38 70 44" stroke="#F5F5F0" stroke-width="3" fill="none" stroke-linecap="round"></path>
    </svg>
    <div style="font-size: 14px; color: #C9CACE; line-height: 1.4"><span style="color: #F5F5F0; font-weight: 700">Le Canap'</span> boude.<br>« Même pas un petit skip ? »</div>
  </div>
</div>

</html>
